<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nueva Tarea - AH TaskManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 2rem;
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        .priority-selector {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .priority-option {
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 5px;
            text-align: center;
        }
        .priority-low {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }
        .priority-medium {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
        }
        .priority-high {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
        .priority-option.active {
            border-width: 2px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html">AH TaskManager</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Mis Tareas</a>
                    </li>
                </ul>
                <div class="navbar-nav">
                    <span class="nav-item nav-link">Usuario Ejemplo</span>
                    <a class="nav-link" href="../auth/logout.html">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="form-container">
            <h2 class="mb-4">Crear Nueva Tarea</h2>
            
            <form action="index.html" method="GET">
                <div class="mb-3">
                    <label for="title" class="form-label">Título <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>
                
                <div class="mb-3">
                    <label for="description" class="form-label">Descripción</label>
                    <textarea class="form-control" id="description" name="description" rows="4"></textarea>
                </div>
                
                <div class="mb-3">
                    <label for="deadline" class="form-label">Fecha Límite</label>
                    <input type="date" class="form-control" id="deadline" name="deadline">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Prioridad</label>
                    <div class="priority-selector">
                        <div class="priority-option priority-low active" onclick="selectPriority(this, 'low')">
                            Baja
                        </div>
                        <div class="priority-option priority-medium" onclick="selectPriority(this, 'medium')">
                            Media
                        </div>
                        <div class="priority-option priority-high" onclick="selectPriority(this, 'high')">
                            Alta
                        </div>
                    </div>
                    <input type="hidden" id="priority" name="priority" value="low">
                </div>
                
                <div class="d-flex justify-content-between mt-4">
                    <a href="index.html" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Crear Tarea</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="mt-5 py-3 text-center text-muted bg-light">
        <div class="container">
            <p class="mb-0">© 2023 AH TaskManager. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function selectPriority(element, value) {
            // Remove active class from all options
            document.querySelectorAll('.priority-option').forEach(el => {
                el.classList.remove('active');
            });
            
            // Add active class to selected option
            element.classList.add('active');
            
            // Update hidden input value
            document.getElementById('priority').value = value;
        }
    </script>
</body>
</html>
